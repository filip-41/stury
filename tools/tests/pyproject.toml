[project]
name = "stury-tests"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "pydantic==2.14.2",
    "jsonschema==4.26.0",
]

[tool.pytest.ini_options]
addopts = "-ra -n auto --dist=loadgroup"
testpaths = ["cli", "oracles"]
pythonpath = ["."]
