# The Rust drivers of the lanes. Cargo unifies a dependency's features across what is built together, so these share
# serde_json's preserve_order and float_roundtrip: preserve_order keeps an object's members in source order, as stury's
# document and every other arm's DOM keep them, and float_roundtrip reads every decimal to the nearest double, as stury
# and the other libraries read it. The schema lane's package is its own, so that jsonschema-rs and boon parse with
# serde_json's default features.
[workspace]
resolver = "3"
members = ["timing", "html_shape", "lanes/doc/rust", "lanes/paths/rust", "lanes/typed/rust", "lanes/records/rust", "lanes/write/rust",
	"lanes/edit/rust", "lanes/model/rust", "xmlview", "lanes/doc/rust-xml", "lanes/paths/rust-xml", "lanes/typed/rust-xml",
	"lanes/write/rust-xml"]
exclude = ["lanes/schema/rust"]

[workspace.dependencies]
timing = { path = "timing" }
sonic-rs = "0.5.10"
simd-csv = "=0.14.0"
garde = { version = "=0.23.0", features = ["derive", "regex"] }
toml_edit = "=0.25.19"
toml = { version = "=1.2.1", features = ["fast_hash"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
quick-xml = { version = "=0.42.0", features = ["serialize"] }
roxmltree = "=0.21.2"
ciborium = "=0.2.2"
minicbor = { version = "=2.3.1", features = ["std", "derive", "half"] }

# HTML arms
html5ever = "=0.40.1"
markup5ever_rcdom = "=0.40.1"
scraper = "=0.29.0"
lol_html = "=3.0.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
