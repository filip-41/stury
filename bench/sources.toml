# Files bench/fetch.py downloads, pinned by URL and SHA-256 so every run reads the same bytes.
#
# kind = "corpus": real-world JSON used by other parsers' benchmarks, from simdjson-data at one commit, saved as
# bench/fixtures/corpus/<name>. The files carry their publishers' terms, so they are fetched, not committed.
# kind = "source": another library's source, saved to build/bench/deps/<name>/ and built there.
# The Rust libraries are pinned by bench/peers/rust/Cargo.lock instead.

