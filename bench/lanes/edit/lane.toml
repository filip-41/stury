[lane]
legend = "GB/s is the source's bytes over the best of three commits of 1000 edits spread over the file's values, then the best of {rounds} rounds."

[arm]
stury = { source = "stury", args = ["set", "{file}", "{edits}"] }

[[group]]
title = "edit"
rows = ["logs.json", "twitter.json", "table.csv", "logs.json5"]
variant = [{ edits = "1000" }]
