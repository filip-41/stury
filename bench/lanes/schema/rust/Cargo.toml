[package]
name = "schema-rust"
version = "0.1.0"
edition = "2024"

# Its own package, outside the workspace of bench/Cargo.toml: jsonschema and boon parse with serde_json's default
# features, as their users do. jsonschema is built without its HTTP and file resolvers: every reference in the lanes'
# schemas is local.
[workspace]

[dependencies]
timing = { path = "../../../timing" }
jsonschema = { version = "=0.60.2", default-features = false }
boon = "=0.6.1"
serde_json = "1"
roxmltree = "=0.21.2"
ciborium = "=0.2.2"
serde_yaml_ng = "=0.10.0"
toml = "=1.2.1"

[[bin]]
name = "schema-rust"
path = "main.rs"

[[bin]]
name = "schema-rust-xml"
path = "xml.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
