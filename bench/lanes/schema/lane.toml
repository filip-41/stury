[lane]
legend = "Single thread, parse + judge per instance. GB/s: the best of {rounds} rounds of each arm's median of ten calls after two warm-ups."

# Each fixture is a schema and a text of instances: a JSONL text, one instance per line, or one document. The job is
# parse plus judge, every instance from its text to a verdict and dropped before the next, each arm with its own parser,
# in two forms. verdict is Blaze's FastValidation, jsonschema's is_valid, boon's validate().is_ok(). errors gives every
# error: Blaze's SimpleOutput over an Exhaustive template, jsonschema's iter_errors, boon's basic output. The schema of a
# benchmark fixture is its schema-noformat.json, so no `format` is asserted.

# The logs.yaml, logs.toml and logs.cbor rows are one document each, read in its own format by stury and judged
# against schema/logs.document.schema.json, which closes the logs.json document. The other arms read JSON only, so they
# are left out of these rows. A format's values are judged as that format types them, and the check is the number of
# instances accepted, 1 per file. The jsonschema and boon drivers read a `.cbor` file with ciborium into a
# serde_json::Value and judge that, so logs.cbor has their arms too: parse, then judge, as users check a CBOR text.

# The logs.yaml row is also judged by jsonschema and boon: each parses the text with serde_yaml_ng into a serde_json `Value`
# and judges that, the way a YAML file is checked against a schema without stury. Blaze reads JSON only.

[arm]
stury ={ source = "stury", args = ["{sub}", "{file}", "{schema}"] }
blaze = { source = "blaze.cc", args = ["{sub}", "{file}", "{schema}"] }
jsonschema = { source = "rust", args = ["{sub}", "{file}", "{schema}", "jsonschema"] }
boon = { source = "rust", args = ["{sub}", "{file}", "{schema}", "boon"] }

# jsonschema_xml reads logs.xml with roxmltree into the value stury reads (each element's text a string, a repeated name an
# array), then judges it with jsonschema.
jsonschema_xml = { source = "rust-xml", args = ["{sub}", "{file}", "{schema}", "jsonschema"], files = ["*.xml"] }

[[group]]
rows = [
	{ label = "geojson", file = "jsonschema-benchmark/geojson/instances.jsonl", schema = "jsonschema-benchmark/geojson/schema-noformat.json" },
	{ label = "openapi", file = "jsonschema-benchmark/openapi/instances.jsonl", schema = "jsonschema-benchmark/openapi/schema-noformat.json" },
	{ label = "draft-04", file = "jsonschema-benchmark/draft-04/instances.jsonl", schema = "jsonschema-benchmark/draft-04/schema-noformat.json" },
	{ label = "cmake-presets", file = "jsonschema-benchmark/cmake-presets/instances.jsonl", schema = "jsonschema-benchmark/cmake-presets/schema-noformat.json" },
	{ label = "ui5-manifest", file = "jsonschema-benchmark/ui5-manifest/instances.jsonl", schema = "jsonschema-benchmark/ui5-manifest/schema-noformat.json" },
	{ label = "helm-chart-lock", file = "jsonschema-benchmark/helm-chart-lock/instances.jsonl", schema = "jsonschema-benchmark/helm-chart-lock/schema-noformat.json" },
	{ label = "cspell", file = "jsonschema-benchmark/cspell/instances.jsonl", schema = "jsonschema-benchmark/cspell/schema-noformat.json" },
	{ label = "deno", file = "jsonschema-benchmark/deno/instances.jsonl", schema = "jsonschema-benchmark/deno/schema-noformat.json" },
	{ label = "code-climate", file = "jsonschema-benchmark/code-climate/instances.jsonl", schema = "jsonschema-benchmark/code-climate/schema-noformat.json" },
	{ label = "pulumi", file = "jsonschema-benchmark/pulumi/instances.jsonl", schema = "jsonschema-benchmark/pulumi/schema-noformat.json" },
	{ label = "aws-cdk", file = "jsonschema-benchmark/aws-cdk/instances.jsonl", schema = "jsonschema-benchmark/aws-cdk/schema-noformat.json" },
	{ label = "ansible-meta", file = "jsonschema-benchmark/ansible-meta/instances.jsonl", schema = "jsonschema-benchmark/ansible-meta/schema-noformat.json" },
	{ label = "clang-format", file = "jsonschema-benchmark/clang-format/instances.jsonl", schema = "jsonschema-benchmark/clang-format/schema-noformat.json" },
	{ label = "babelrc", file = "jsonschema-benchmark/babelrc/instances.jsonl", schema = "jsonschema-benchmark/babelrc/schema-noformat.json" },
	{ label = "krakend", file = "jsonschema-benchmark/krakend/instances.jsonl", schema = "jsonschema-benchmark/krakend/schema-noformat.json" },
	{ label = "logs", file = "logs.ndjson", schema = "schema/logs.schema.json" },
	{ label = "twitter", file = "schema/twitter.json", schema = "schema/twitter.schema.json" },
	{ label = "citm", file = "schema/citm.json", schema = "schema/citm.schema.json" },
	{ label = "applicator", file = "schema/applicator.ndjson", schema = "schema/applicator.schema.json" },
	{ label = "logs.yaml", file = "logs.yaml", schema = "schema/logs.document.schema.json" },
	{ label = "logs.toml", file = "logs.toml", schema = "schema/logs.document.schema.json" },
	{ label = "logs.cbor", file = "logs.cbor", schema = "schema/logs.document.schema.json" },
	# logs.xml is read as XML by stury and judged against schema/logs.xml.schema.json, which closes the tree of the text,
	# every text a string. jsonschema_xml parses the text first.
	{ label = "logs.xml", file = "logs.xml", schema = "schema/logs.xml.schema.json" },
]
