# Files next/bench/fetch.py downloads, pinned by URL and SHA-256 so every run reads the same bytes.
#
# kind = "corpus": real-world JSON used by other parsers' benchmarks, from simdjson-data at one commit, saved as
# next/bench/fixtures/corpus/<name>. The files carry their publishers' terms, so they are fetched, not committed.
# kind = "source": another library's source, saved to next/build/bench/deps/<name>/ and built there.
# The Rust libraries are pinned by next/bench/peers/rust/Cargo.lock instead.

[[pin]]
kind = "corpus"
name = "twitter.json"
url = "https://raw.githubusercontent.com/simdjson/simdjson-data/4197c425e857f0ec38e89822fdd0bd9ea21f4daf/jsonexamples/twitter.json"
