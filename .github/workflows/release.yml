name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The tagged commit's full CI run on main, which the release takes in place of running the gate again. Tag after
  # main's run has passed, or the gate runs here.
  passed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      ci: ${{ steps.find.outputs.ci }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=success" --jq '.workflow_runs[].id')
          ci=none
          for id in $runs; do
            # A docs-only run skipped the suites, so it does not count.
            short=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion != "success")] | length')
            if [ "$short" = 0 ]; then ci=$id; break; fi
          done
          echo "ci=$ci" | tee -a "$GITHUB_OUTPUT"

  gate:
    needs: passed
    if: needs.passed.outputs.ci == 'none'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [passed, gate]
    if: >-
      !cancelled() && needs.passed.result == 'success' &&
      (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && needs.passed.outputs.ci != 'none'))
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 sets the Linux binaries' glibc floor at 2.35.
          - os: ubuntu-22.04
            name: linux-amd64
          - os: ubuntu-22.04-arm
            name: linux-arm64
          - os: macos-15
            name: darwin-arm64
          - os: macos-15
            name: darwin-amd64
            opt: -o:speed -target:darwin_amd64
          - os: windows-2025
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ github.ref_name }}
      EXE: ${{ startsWith(matrix.os, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - name: Build
        env:
          TARGET_OPT: ${{ matrix.opt }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # The Makefile's link flags are POSIX's: Windows takes its own from platform_windows.odin.
            mkdir -p build
            odin build cmd/stury -o:speed -resource:cmd/stury/stury.rc -define:STURY_VERSION="'${VERSION#v}'" -out:build/stury.exe
          elif [ -n "$TARGET_OPT" ]; then
            make build-cli STURY_VERSION="${VERSION#v}" OPT="$TARGET_OPT"
          else
            make build-cli STURY_VERSION="${VERSION#v}"
          fi
      - name: Check
        run: |
          set -e
          run=""
          if [ "${{ matrix.name }}" = "darwin-amd64" ]; then
            # Under pipefail, grep -q stopping early would fail `file`.
            file build/stury | grep x86_64 > /dev/null
            run="arch -x86_64"
          fi
          [ "$($run build/stury"$EXE" --version)" = "stury-${VERSION#v}" ]
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Smoke the release binary
        env:
          PYTHONUTF8: "1"
        run: |
          bin=build/stury$EXE
          if [ "${{ matrix.name }}" = "darwin-amd64" ]; then
            # The smoke tests take the binary as one word: wrap the Intel one.
            printf '#!/bin/sh\nexec arch -x86_64 "%s/build/stury" "$@"\n' "$PWD" > build/stury-rosetta
            chmod +x build/stury-rosetta
            bin=build/stury-rosetta
          fi
          uv run --frozen --directory tools/tests pytest -n auto --stury="$PWD/$bin" cli/test_smoke.py
      - name: Package
        run: |
          d="stury-${VERSION#v}-${{ matrix.name }}"
          mkdir "$d"
          cp "build/stury$EXE" LICENSE THIRD_PARTY_NOTICES README.md CHANGELOG.md "$d/"
          cp -R docs "$d/"
          # Links to repository files the archive does not carry point at the tag on GitHub.
          # Windows' python3 is a stub that opens the Store.
          py=python3
          [ "$RUNNER_OS" != Windows ] || py=python
          $py - "$d" "https://github.com/${{ github.repository }}/blob/$VERSION" <<'PY'
          import os, re, sys
          root, base = sys.argv[1], sys.argv[2]
          for dirpath, _, names in os.walk(root):
              for name in names:
                  if not name.endswith(".md"):
                      continue
                  path = os.path.join(dirpath, name)
                  rel_dir = os.path.relpath(dirpath, root)
                  def fix(m):
                      target, anchor = m.group(1), m.group(2) or ""
                      if os.path.exists(os.path.join(dirpath, target)):
                          return m.group(0)
                      return f"]({base}/{os.path.normpath(os.path.join(rel_dir, target))}{anchor})"
                  text = open(path, encoding="utf-8").read()
                  text = re.sub(r"\]\((?!https?:|#|mailto:)([^)#\s]+)(#[^)\s]*)?\)", fix, text)
                  open(path, "w", encoding="utf-8").write(text)
          PY
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$d.zip"
            7z a -tzip "$archive" "$d" > /dev/null
            sha256sum "$archive" > "$archive.sha256"
          else
            archive="$d.tar.gz"
            tar -czf "$archive" "$d"
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: |
            stury-*.tar.gz*
            stury-*.zip*

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Notes from the CHANGELOG
        run: |
          # The section under `## <version>`, up to the next `## ` heading; a tag without one is refused.
          awk -v v="${VERSION#v}" '$1 == "##" { if (found) exit; found = ($2 == v) } found && !/^## /' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no '## ${VERSION#v}' section"; exit 1; }
      - name: Draft release
        run: gh release create "$VERSION" dist/* --draft --title "stury ${VERSION#v}" --notes-file notes.md
