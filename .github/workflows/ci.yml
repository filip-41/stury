name: ci

# The gate: lint, the suites on every target, the jq differential, the sanitizers and Windows, all at once. A `v*`
# tag runs it through release.yml before any binary is built.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - run: make lint
      # The generated fixtures hold for the CPython the generators were checked on.
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"
      - name: Docs
        run: |
          sudo apt-get install -y mandoc
          make lint-fixtures lint-man

  # The library suites with their compiles at once, then the command line against its smoke cases and the jq corpus.
  # The command line's suites time their runs, so they do not share the host with the compiles.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - run: make -j4 test-lib
      - run: make test-examples test-cli test-jq

  # Odin has no macOS Intel toolchain: the x86 suites are cross-compiled from the arm64 runner and run under Rosetta.
  test-x86:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - run: make -j4 test-x86

  # The jq 1.8.2 differential: jq_suite in diff mode, jq_diff and regex_diff over every seed. The test job runs the
  # corpus but cannot compare against jq itself. A seed per runner: each driver keeps every core busy.
  diff:
    strategy:
      fail-fast: false
      matrix:
        seed: [77, 1016, 5]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - name: Install jq 1.8.2
        run: |
          curl -fsSL -o /tmp/jq \
            https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
          echo 'b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  /tmp/jq' | sha256sum -c -
          sudo install -m 0755 /tmp/jq /usr/local/bin/jq
          jq --version | grep -qx 'jq-1.8.2'
      - run: make -j -O diff DIFF_SEEDS=${{ matrix.seed }}

  # The x86 tiers. A hosted x64 runner's processor varies (AVX-512BW is not guaranteed) and Rosetta has neither AVX-512
  # nor a way to force it, so every suite is built for each tier and run under Intel SDE emulating a Nehalem (the
  # x86-64-v2 floor), a Haswell and a Sapphire Rapids (SDE's Skylake-X has no brand string, which core:sys/info's init indexes past).
  wide:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - name: Install Intel SDE
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sde.tar.xz" "$SDE_URL"
          echo "$SDE_SHA256  $RUNNER_TEMP/sde.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/sde"
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1
          echo "$RUNNER_TEMP/sde" >> "$GITHUB_PATH"
          # SDE injects itself with ptrace, which Ubuntu's yama setting forbids.
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
      - run: make test-wide

  # Sanitizer runs are checked where they were made to pass: macOS on Apple silicon.
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        target: [test-asan, test-tsan]
    runs-on: macos-15
    # The sanitized CLI builds take most of this: 66 min for ASan and 47 for TSan on 2026-11-04. A job
    # that hangs would otherwise hold the release for GitHub's 6-hour default.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - run: make ${{ matrix.target }}

  # Windows is built only here. It builds the library suites that do not read the POSIX-only walktest helper (json and
  # dsv do) and the CLI, then runs a few answers end to end. smoke.py is not run here: its CPU and memory guards need
  # POSIX resource limits and rusage, and it checks file modes.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - shell: bash
        run: |
          set -e
          # The Makefile's test packages, but json and dsv, whose tests read the POSIX-only walktest helper.
          for p in $(python tools/checks.py list TEST_PKGS | tr -d '\r' | grep -v -e '^json/' -e '^dsv/'); do
            odin test $p -o:minimal -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -define:RECORDS_SLICE=1 -define:RECORDS_FAN_AFTER=1 -define:RECORDS_SPARSE=1000000000 -out:test.exe
          done
          odin build cmd/stury -o:speed -define:STURY_VERSION='"ci"' -out:stury.exe
      - name: Answers through files and pipes
        shell: bash
        run: |
          set -e
          [ "$(echo '{"a":[1,2]}' | ./stury.exe -c '.a')" = "[1,2]" ]
          # Output is bytes as written, LF and no CR, with jq's -b or without it.
          [ "$(echo '[1,2]' | ./stury.exe -c '.[]' | od -An -tx1 | tr -d ' \n')" = "310a320a" ]
          [ "$(echo '[1,2]' | ./stury.exe -b -c '.[]' | od -An -tx1 | tr -d ' \n')" = "310a320a" ]
          printf '{"a":1}\n{"a":2}\n' > two.json
          [ "$(./stury.exe -c '.a' two.json | tr -d '\r' | paste -sd, -)" = "1,2" ]
          [ "$(echo '"2015-03-05T23:51:47Z"' | ./stury.exe -r 'fromdate | todate')" = "2015-03-05T23:51:47Z" ]
          # The UCRT's strftime has no %s, %k or %l; the jq suite's libc rows are not run here.
          [ "$(./stury.exe -nr '1425599621 | strftime("%s %k %l %V %r")')" = "1425599621 23 11 10 11:53:41 PM" ]
          [ "$(./stury.exe -n '[limit(3; recurse(.+1))] | length' <<< 0)" = "3" ]
          # `! cmd` does not trip errexit: a command that must fail exits the script when it succeeds.
          echo '{' | ./stury.exe . 2>/dev/null && exit 1
          # The CSV codec, both halves, through a file and a pipe.
          printf 'a,b\n1,2\n' > two.csv
          [ "$(./stury.exe --from csv -c '.b' two.csv)" = '"2"' ]
          [ "$(./stury.exe --from csv --to csv 'select(.a == "1")' two.csv | tr -d '\r' | paste -sd, -)" = "a,b,1,2" ]
          [ "$(printf 'a,b\n3,4\n' | ./stury.exe --from csv -c '.a')" = '"3"' ]
          # fmt: the layout with every spelling and member kept, --check, and --in-place over an existing file.
          printf '{"b":1e2,"b":2}' > fmt.json
          [ "$(./stury.exe fmt fmt.json | tr -d ' \r\n')" = '{"b":1e2,"b":2}' ]
          s=0; ./stury.exe fmt --check fmt.json || s=$?; [ "$s" = 1 ]
          ./stury.exe fmt --in-place fmt.json
          ./stury.exe fmt --check fmt.json
          [ "$(tr -d ' \r\n' < fmt.json)" = '{"b":1e2,"b":2}' ]
          [ "$(wc -l < fmt.json | tr -d ' ')" = 4 ]

      - name: jq 1.8.2 corpus and cli.tsv
        shell: bash
        env:
          PYTHONUTF8: "1"
          STURY_TEST_TIMEOUT: "30"
        run: python cmd/stury/test/jq_suite.py ./stury.exe
