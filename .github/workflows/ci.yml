name: ci
# v2 only: this branch builds and tests `next/`, and v1's suites stay on main's copy of this file.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - run: make -C next lint

  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - run: make -C next test

  # The test packages `make -C next test` runs, found the same way, without make.
  windows:
    timeout-minutes: 60
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - shell: bash
        working-directory: next
        run: |
          set -e
          mkdir -p build
          for p in $(find . -type d -name test -not -path './build/*' | sed 's|^\./||' | sort); do
            echo "== $p"
            odin test $p -o:minimal -collection:stury=. -define:ODIN_TEST_FAIL_ON_BAD_MEMORY=true -out:build/test.exe
          done
