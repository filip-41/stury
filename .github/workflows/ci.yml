name: ci

# The gate, in stages: lint, then the suites on every target, then the sanitizers and Windows. A `v*` tag runs
# it through release.yml before any binary is built.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - run: make lint
      # The fixtures against bench/manifest.toml's hashes (CPython 3.11+, writes ~480 MB under bench/fixtures),
      # and the man page.
      - name: Docs
        run: |
          python3 bench/gen.py --check > /dev/null
          sudo apt-get install -y mandoc
          mandoc -T lint -W warning docs/stury.1

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - run: make test test-modes
      # Odin has no macOS Intel toolchain: cross-compile the x86 suites from the
      # arm64 runner and run them under Rosetta.
      - if: matrix.os == 'macos-15'
        run: make test-x86

  # The jq 1.8.2 differential: jq_suite in diff mode, jq_diff and regex_diff
  # over every seed. The other test job runs the corpus but cannot compare
  # against jq itself.
  diff:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - name: Install jq 1.8.2
        run: |
          curl -fsSL -o /tmp/jq \
            https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
          sudo install -m 0755 /tmp/jq /usr/local/bin/jq
          jq --version | grep -qx 'jq-1.8.2'
      # The four diff targets at once: one script's Python driver holds a core, so one at a time leaves most
      # of the runner idle.
      - run: make -j -O diff

  # Sanitizer runs are gated on macOS on Apple silicon only.
  sanitizers:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [test-asan, test-tsan]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - run: make ${{ matrix.target }}

  # Windows is built only here. It builds the library suites and the CLI, then runs a few answers end to end.
  windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-odin
      - shell: bash
        run: |
          odin test core/test -collection:stury=.
          odin test json/test/api -collection:stury=.
          odin test csv/test -collection:stury=.
          odin build cmd/stury -o:speed -collection:stury=. -define:REFUSE_DUPLICATES=false -define:STURY_VERSION='"ci"' -out:stury.exe
      - name: Answers through files and pipes
        shell: bash
        run: |
          set -e
          [ "$(echo '{"a":[1,2]}' | ./stury.exe -c '.a')" = "[1,2]" ]
          # Output is bytes as written, LF and no CR, with jq's -b or without it.
          [ "$(echo '[1,2]' | ./stury.exe -c '.[]' | od -An -tx1 | tr -d ' \n')" = "310a320a" ]
          [ "$(echo '[1,2]' | ./stury.exe -b -c '.[]' | od -An -tx1 | tr -d ' \n')" = "310a320a" ]
          printf '{"a":1}\n{"a":2}\n' > two.json
          [ "$(./stury.exe -c '.a' two.json | tr -d '\r' | paste -sd, -)" = "1,2" ]
          [ "$(echo '"2015-03-05T23:51:47Z"' | ./stury.exe -r 'fromdate | todate')" = "2015-03-05T23:51:47Z" ]
          [ "$(./stury.exe -n '[limit(3; recurse(.+1))] | length' <<< 0)" = "3" ]
          # `! cmd` does not trip errexit: a command that must fail exits the script when it succeeds.
          echo '{' | ./stury.exe . 2>/dev/null && exit 1
          # The CSV codec, both halves, through a file and a pipe.
          printf 'a,b\n1,2\n' > two.csv
          [ "$(./stury.exe --from csv -c '.b' two.csv)" = '"2"' ]
          [ "$(./stury.exe --from csv --to csv 'select(.a == "1")' two.csv | tr -d '\r' | paste -sd, -)" = "a,b,1,2" ]
          [ "$(printf 'a,b\n3,4\n' | ./stury.exe --from csv -c '.a')" = '"3"' ]
          # fmt: the layout with every spelling and member kept, --check, and --in-place over an existing file.
          printf '{"b":1e2,"b":2}' > fmt.json
          [ "$(./stury.exe fmt fmt.json | tr -d ' \r\n')" = '{"b":1e2,"b":2}' ]
          ./stury.exe fmt --check fmt.json && exit 1
          ./stury.exe fmt --in-place fmt.json
          ./stury.exe fmt --check fmt.json
          [ "$(tr -d ' \r\n' < fmt.json)" = '{"b":1e2,"b":2}' ]
          [ "$(wc -l < fmt.json | tr -d ' ')" = 4 ]
