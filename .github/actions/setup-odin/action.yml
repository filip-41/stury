name: Set up Odin
description: >
  Odin at a pinned release, built against a pinned LLVM and cached, and that LLVM: its clang links Odin's objects on
  Linux, and on macOS supplies the sanitizer runtimes and libFuzzer.
inputs:
  version:
    description: Odin release tag
    default: dev-2026-11a
  llvm:
    description: >
      LLVM major version. On Linux and macOS Odin is built from the release's commit against it, since those releases
      ship a compiler on an older LLVM. The Windows release is built with this version and is downloaded.
    default: "22"
runs:
  using: composite
  steps:
    - name: LLVM (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # apt.llvm.org's repository under its signing key, pinned by fingerprint; apt then verifies every package
        # against that key. The key file must hold exactly that one primary key.
        want=6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        curl -fsSL -o "$RUNNER_TEMP/llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
        got=$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1 == "pub" { p = 1; next } $1 == "fpr" && p { print $10; p = 0 }')
        [ "$got" = "$want" ] || { echo "apt.llvm.org key fingerprint is '$got', expected $want"; exit 1; }
        sudo install -d -m 0755 /etc/apt/keyrings
        gpg --dearmor < "$RUNNER_TEMP/llvm.asc" | sudo tee /etc/apt/keyrings/apt.llvm.org.gpg > /dev/null
        . /etc/os-release
        echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-${{ inputs.llvm }} main" |
          sudo tee /etc/apt/sources.list.d/apt.llvm.org.list > /dev/null
        sudo apt-get update
        # llvm-N-dev holds the headers and libLLVM that building Odin needs. GNU time: smoke.sh reads a run's peak RSS
        # from `/usr/bin/time -f %M`.
        sudo apt-get install -y "clang-${{ inputs.llvm }}" "lld-${{ inputs.llvm }}" "llvm-${{ inputs.llvm }}" "llvm-${{ inputs.llvm }}-dev" time
        echo "/usr/lib/llvm-${{ inputs.llvm }}/bin" >> "$GITHUB_PATH"

    - name: LLVM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install "llvm@${{ inputs.llvm }}" "lld@${{ inputs.llvm }}"
        echo "$(brew --prefix "llvm@${{ inputs.llvm }}")/bin" >> "$GITHUB_PATH"

    - name: Odin source
      id: source
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)   os=linux-amd64 ;;
          Linux-ARM64) os=linux-arm64 ;;
          macOS-ARM64) os=macos-arm64 ;;
          # Odin has no macOS Intel toolchain: Intel targets are
          # cross-compiled from the arm64 runner.
          Windows-X64) os=windows-amd64 ;;
          *) echo "no Odin build for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
        esac
        # The commit each release tag names, and the SHA-256 of its Windows asset from the release's published
        # digests. A version not listed here fails until both are added.
        case "${{ inputs.version }}" in
          dev-2026-11a) commit=9a6991685ddf663956d9836602eb421e141fc443 windows=259effedf2997293c8fa4a5e497496f8ebce9f826652d9dd353a9dd2113c31fd ;;
          *) echo "no pinned commit for ${{ inputs.version }}: add it to .github/actions/setup-odin/action.yml"; exit 1 ;;
        esac
        echo "commit=$commit" >> "$GITHUB_OUTPUT"
        echo "windows_sha256=$windows" >> "$GITHUB_OUTPUT"
        echo "asset=odin-$os-${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        echo "key=odin-$os-${{ inputs.version }}-llvm${{ inputs.llvm }}" >> "$GITHUB_OUTPUT"

    - name: Cache Odin
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/odin
        key: ${{ steps.source.outputs.key }}

    - name: Build Odin
      if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # A fetch by commit id checks out exactly that commit. build_odin.sh reads the version from its git history.
        git init -q ~/odin
        cd ~/odin
        git fetch -q --depth 1 https://github.com/odin-lang/Odin.git "${{ steps.source.outputs.commit }}"
        git checkout -q FETCH_HEAD
        if [ "${{ runner.os }}" = macOS ]; then
          export LLVM_CONFIG="$(brew --prefix "llvm@${{ inputs.llvm }}")/bin/llvm-config"
        else
          export LLVM_CONFIG="/usr/lib/llvm-${{ inputs.llvm }}/bin/llvm-config"
        fi
        ./build_odin.sh release

    - name: Download Odin (Windows)
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/odin
        archive="$RUNNER_TEMP/odin.zip"
        curl -fsSL -o "$archive" \
          "https://github.com/odin-lang/Odin/releases/download/${{ inputs.version }}/${{ steps.source.outputs.asset }}.zip"
        got=$(openssl dgst -sha256 "$archive" | awk '{ print $NF }')
        [ "$got" = "${{ steps.source.outputs.windows_sha256 }}" ] ||
          { echo "sha256 of ${{ steps.source.outputs.asset }} is $got, expected ${{ steps.source.outputs.windows_sha256 }}"; exit 1; }
        unzip -q "$archive" -d ~/odin

    - name: Put Odin on PATH
      shell: bash
      run: |
        # The Windows archive may or may not wrap its files in a directory of its own.
        bin=$(find ~/odin -type f \( -name odin -o -name odin.exe \) -perm -u+x | head -n 1)
        [ -n "$bin" ] || { echo "no odin executable in ~/odin"; exit 1; }
        dir=$(dirname "$bin")
        # GITHUB_PATH takes a native path, which Git Bash's /c/... is not on Windows.
        if command -v cygpath >/dev/null; then dir=$(cygpath -w "$dir"); fi
        echo "$dir" >> "$GITHUB_PATH"
        "$bin" report
