name: Set up Odin
description: Odin at a pinned commit, built against a pinned LLVM (Windows links the LLVM Odin bundles)
inputs:
  commit:
    default: 31ce7c0a5e2ca6662405bbdabdfff2251afeda98
  llvm:
    default: "22"
runs:
  using: composite
  steps:
    - name: LLVM (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        want=6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        curl -fsSL -o "$RUNNER_TEMP/llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
        got=$(gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | awk -F: '$1 == "pub" { p = 1; next } $1 == "fpr" && p { print $10; p = 0 }')
        [ "$got" = "$want" ] || { echo "apt.llvm.org key fingerprint is '$got', expected $want"; exit 1; }
        sudo install -d -m 0755 /etc/apt/keyrings
        gpg --dearmor < "$RUNNER_TEMP/llvm.asc" | sudo tee /etc/apt/keyrings/apt.llvm.org.gpg > /dev/null
        . /etc/os-release
        echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-${{ inputs.llvm }} main" |
          sudo tee /etc/apt/sources.list.d/apt.llvm.org.list > /dev/null
        sudo apt-get update
        # llvm-N-dev holds the headers and libLLVM that building Odin needs.
        sudo apt-get install -y "clang-${{ inputs.llvm }}" "lld-${{ inputs.llvm }}" "llvm-${{ inputs.llvm }}" "llvm-${{ inputs.llvm }}-dev"
        echo "/usr/lib/llvm-${{ inputs.llvm }}/bin" >> "$GITHUB_PATH"

    - name: LLVM (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install "llvm@${{ inputs.llvm }}" "lld@${{ inputs.llvm }}"
        echo "$(brew --prefix "llvm@${{ inputs.llvm }}")/bin" >> "$GITHUB_PATH"

    - name: Odin source
      id: source
      shell: bash
      run: |
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)   os=linux-amd64 ;;
          Linux-ARM64) os=linux-arm64 ;;
          macOS-ARM64) os=macos-arm64 ;;
          Windows-X64) os=windows-amd64 ;;
          *) echo "no Odin build for ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
        esac
        # The OS release is in the key: an Odin built on a newer Ubuntu needs a newer glibc than an older one has.
        case "${{ runner.os }}" in
          Linux) release=$(. /etc/os-release && echo "$ID$VERSION_ID") ;;
          macOS) release=macos$(sw_vers -productVersion | cut -d. -f1) ;;
          *) release=any ;;
        esac
        echo "key=odin-$os-$release-${{ inputs.commit }}-llvm${{ inputs.llvm }}" >> "$GITHUB_OUTPUT"

    - name: Cache Odin
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/odin
        key: ${{ steps.source.outputs.key }}

    - name: Build Odin
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git init -q ~/odin
        cd ~/odin
        git fetch -q --depth 1 https://github.com/odin-lang/Odin.git "${{ inputs.commit }}"
        git checkout -q FETCH_HEAD
        case "${{ runner.os }}" in
          macOS) LLVM_CONFIG="$(brew --prefix "llvm@${{ inputs.llvm }}")/bin/llvm-config" ./build_odin.sh release ;;
          Linux) LLVM_CONFIG="/usr/lib/llvm-${{ inputs.llvm }}/bin/llvm-config" ./build_odin.sh release ;;
          # build.bat finds MSVC through vswhere and links bin/llvm/windows.
          Windows) cmd //c "build.bat release" ;;
        esac

    - name: Put Odin on PATH
      shell: bash
      run: |
        bin=$(find ~/odin -type f \( -name odin -o -name odin.exe \) -perm -u+x | head -n 1)
        [ -n "$bin" ] || { echo "no odin executable in ~/odin"; exit 1; }
        dir=$(dirname "$bin")
        if command -v cygpath >/dev/null; then dir=$(cygpath -w "$dir"); fi
        echo "$dir" >> "$GITHUB_PATH"
        "$bin" report
